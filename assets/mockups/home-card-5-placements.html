<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mintzer — 10 complete Home styles</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Roboto, system-ui, sans-serif; background: #E8EAED; color: #202124; }
    .page { max-width: 1680px; margin: 0 auto; padding: 20px 16px 80px; }
    h1 { font-size: 22px; font-weight: 800; }
    .lead { font-size: 14px; color: #5F6368; line-height: 1.55; margin: 8px 0 12px; max-width: 920px; }
    .note {
      font-size: 12px; line-height: 1.45; max-width: 920px; margin-bottom: 12px;
      background: #EDE7FF; border: 1px solid #DDD4FF; padding: 10px 12px; border-radius: 10px;
    }
    .jump { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
    .jump a {
      font-size: 12px; font-weight: 800; text-decoration: none; color: #7B61FF;
      background: #fff; border: 1px solid #DDD4FF; padding: 5px 10px; border-radius: 99px;
    }
    .board { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 22px; }
    .panel { background: #fff; border: 1px solid #DADCE0; border-radius: 16px; overflow: hidden; }
    .ph { padding: 12px 14px; background: #F8F9FA; border-bottom: 1px solid #E8EAED; }
    .ph h2 { font-size: 14px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
    .ph p { font-size: 12px; color: #5F6368; margin-top: 4px; line-height: 1.4; }
    .num {
      width: 22px; height: 22px; border-radius: 50%; background: #7B61FF; color: #fff;
      font-size: 12px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center;
    }
    .pb { padding: 16px; background: #F1F3F4; display: flex; justify-content: center; }
    .phone {
      width: 360px; height: 740px; max-width: 100%;
      background: #F8F9FA; border: 1px solid #DADCE0; border-radius: 28px;
      overflow: hidden; display: flex; flex-direction: column;
      box-shadow: 0 12px 32px rgba(32,33,36,.12);
    }
    .status { flex-shrink: 0; display: flex; justify-content: space-between; padding: 6px 16px 0; font-size: 11px; font-weight: 700; background: #7B61FF; color: #fff; }
    .header { flex-shrink: 0; background: #7B61FF; color: #fff; padding: 8px 14px 12px; }
    .header-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .greeting h2 { font-size: 18px; font-weight: 800; }
    .greeting p { font-size: 11px; color: #DDD4FF; margin-top: 2px; }
    .actions { display: flex; align-items: center; gap: 6px; }
    .wallet { background: rgba(255,255,255,.22); color: #fff; border-radius: 99px; padding: 5px 10px; font-size: 12px; font-weight: 800; }
    .icon { width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,.16); display: grid; place-items: center; font-size: 13px; }
    .scroll { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; background: #F8F9FA; }
    .scroll::-webkit-scrollbar { width: 3px; }
    .scroll::-webkit-scrollbar-thumb { background: #DADCE0; border-radius: 4px; }
    .toolbar { display: flex; gap: 8px; padding: 10px 12px 0; }
    .search {
      flex: 1; display: flex; align-items: center; gap: 8px; background: #fff;
      border: 1px solid #E8EAED; border-radius: 24px; padding: 8px 12px; font-size: 13px; color: #5F6368;
    }
    .vtoggle { display: flex; border: 1px solid #E8EAED; border-radius: 12px; overflow: hidden; background: #fff; }
    .vtoggle span { width: 34px; height: 34px; display: grid; place-items: center; color: #5F6368; font-size: 13px; }
    .vtoggle .on { background: #EDE7FF; color: #7B61FF; }
    .chips { display: flex; gap: 6px; padding: 10px 12px; }
    .chip { font-size: 11px; font-weight: 700; padding: 6px 10px; border-radius: 99px; background: #fff; border: 1px solid #E8EAED; color: #5F6368; }
    .chip.on { background: #7B61FF; color: #fff; border-color: #7B61FF; }
    .proof { margin: 0 12px 8px; padding: 8px 10px; background: #fff; border: 1px solid #E8EAED; border-radius: 10px; font-size: 11px; color: #5F6368; }
    .proof b { color: #188038; }
    .list-meta { display: flex; justify-content: space-between; padding: 0 12px 8px; font-size: 11px; color: #5F6368; }
    .list-meta em { font-style: normal; color: #7B61FF; font-weight: 600; }
    .pad { padding: 0 10px 64px; position: relative; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .stack { display: flex; flex-direction: column; gap: 8px; }
    .nav {
      flex-shrink: 0; display: grid; grid-template-columns: repeat(4, 1fr);
      border-top: 1px solid #E8EAED; background: #fff; padding: 8px 0 10px;
      font-size: 10px; color: #5F6368; text-align: center; font-weight: 600;
    }
    .nav .on { color: #7B61FF; }
    .help {
      position: absolute; right: 12px; bottom: 12px;
      background: #7B61FF; color: #fff; border-radius: 99px; font-size: 11px; font-weight: 700;
      padding: 8px 12px; box-shadow: 0 4px 12px rgba(123,97,255,.35);
    }
    img { display: block; }
    .pin {
      position: absolute; top: 5px; left: 5px; z-index: 2;
      width: 22px; height: 22px; border-radius: 50%; overflow: hidden;
      border: 1.5px solid #fff; background: #fff;
    }
    .pin img { width: 100%; height: 100%; object-fit: contain; }
    .gst {
      position: absolute; top: 5px; right: 5px; z-index: 2;
      font-size: 8px; font-weight: 800; padding: 2px 5px; border-radius: 4px;
      background: #FEF7E0; color: #E37400; border: 1px solid #F9AB00;
    }
    .prod { width: 100%; height: 100%; object-fit: contain; }
    .logo { width: 16px; height: 16px; border-radius: 50%; object-fit: contain; background: #fff; flex-shrink: 0; vertical-align: middle; }
    .ibox { position: relative; overflow: hidden; }
    .ibox.dark { background: #111; }
    .ibox:not(.dark) { background: #fff; }
    .card { background: #fff; border: 1px solid #E8EAED; border-radius: 12px; overflow: hidden; }
    .earn { border: 0; background: #7B61FF; color: #fff; font-weight: 800; cursor: pointer; }

    /* 1 sticker */
    .s1 .ibox { height: 108px; }
    .s1 .sticker { position: absolute; bottom: 6px; right: 6px; z-index: 2; background: #7B61FF; color: #fff; font-size: 10px; font-weight: 800; padding: 4px 7px; border-radius: 8px; }
    .s1 .body { padding: 7px 8px 8px; }
    .s1 .name { font-size: 11px; font-weight: 700; line-height: 1.25; height: 2.5em; overflow: hidden; }
    .s1 .sub { display: flex; align-items: center; gap: 4px; font-size: 10px; color: #5F6368; margin-top: 4px; }

    /* 2 poster */
    .s2 .ttl { font-size: 11px; font-weight: 700; line-height: 1.25; padding: 8px 8px 4px; height: 2.7em; overflow: hidden; }
    .s2 .ibox { height: 96px; margin: 0 8px; border-radius: 8px; }
    .s2 .foot { display: flex; align-items: center; gap: 6px; margin-top: 6px; padding: 6px 8px 8px; border-top: 1px solid #F1F3F4; }
    .s2 .pay { font-size: 10px; color: #5F6368; flex: 1; min-width: 0; }
    .s2 .earn { font-size: 10px; border-radius: 99px; padding: 5px 8px; white-space: nowrap; }

    /* 3 overlay */
    .s3 { position: relative; height: 168px; background: #111; border-radius: 12px; overflow: hidden; }
    .s3 .ibox { position: absolute; inset: 0; }
    .s3 .ibox img { width: 100%; height: 100%; object-fit: contain; }
    .s3 .wash { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; padding: 28px 8px 8px; background: linear-gradient(transparent, rgba(20,16,32,.92)); color: #fff; }
    .s3 .name { font-size: 11px; font-weight: 700; margin-bottom: 6px; }
    .s3 .bar { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .s3 .pay { font-size: 10px; opacity: .9; }
    .s3 .earn { border-radius: 99px; font-size: 10px; padding: 5px 8px; }

    /* 4 caption */
    .s4 { padding: 8px; display: flex; flex-direction: column; gap: 5px; }
    .s4 .ibox { height: 78px; border-radius: 8px; }
    .s4 .name { font-size: 11px; font-weight: 700; line-height: 1.25; height: 2.5em; overflow: hidden; }
    .s4 .sub { font-size: 10px; color: #5F6368; display: flex; align-items: center; gap: 5px; }
    .s4 .earn { width: 100%; border-radius: 8px; font-size: 12px; padding: 8px; }

    /* 5 hero */
    .hero { position: relative; border-radius: 14px; overflow: hidden; height: 196px; background: #111; margin-bottom: 8px; }
    .hero img { width: 100%; height: 100%; object-fit: contain; }
    .hero .wash { position: absolute; inset: auto 0 0 0; padding: 36px 12px 12px; background: linear-gradient(transparent, rgba(20,16,32,.94)); color: #fff; }
    .hero .kicker { font-size: 9px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: #DDD4FF; }
    .hero .name { font-size: 15px; font-weight: 800; margin: 4px 0 8px; }
    .hero .bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 11px; }
    .hero .earn { border-radius: 99px; font-size: 12px; padding: 7px 12px; }
    .s5 .ibox { height: 72px; }
    .s5 .body { padding: 6px 7px 8px; }
    .s5 .name { font-size: 10px; font-weight: 700; line-height: 1.25; height: 2.5em; overflow: hidden; }
    .s5 .row { display: flex; justify-content: space-between; align-items: center; margin-top: 5px; gap: 4px; }
    .s5 .pay { font-size: 9px; color: #5F6368; }
    .s5 .earn { font-size: 9px; border-radius: 99px; padding: 4px 7px; }

    /* 6 photo band */
    .s6 .ibox { height: 100px; }
    .s6 .band { display: grid; grid-template-columns: 1fr 1fr; }
    .s6 .band .pay { background: #F8F9FA; font-size: 10px; font-weight: 800; padding: 7px 4px; text-align: center; }
    .s6 .band .pay span { display: block; font-size: 8px; font-weight: 700; color: #5F6368; }
    .s6 .band .earn { border-radius: 0; font-size: 11px; padding: 7px 4px; }
    .s6 .name { font-size: 11px; font-weight: 700; padding: 7px 8px 8px; line-height: 1.25; min-height: 2.6em; }

    /* 7 wide row */
    .s7 { display: grid; grid-template-columns: 88px 1fr; gap: 0; min-height: 88px; }
    .s7 .ibox { height: 88px; }
    .s7 .body { padding: 8px 10px; display: flex; flex-direction: column; justify-content: space-between; min-width: 0; }
    .s7 .name { font-size: 12px; font-weight: 700; line-height: 1.25; }
    .s7 .sub { font-size: 10px; color: #5F6368; display: flex; align-items: center; gap: 4px; margin: 4px 0; }
    .s7 .money { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .s7 .pay { font-size: 11px; font-weight: 700; }
    .s7 .earn { border-radius: 99px; font-size: 11px; padding: 5px 10px; }

    /* 8 pills */
    .s8 .ibox { height: 90px; }
    .s8 .body { padding: 7px 8px 8px; }
    .s8 .name { font-size: 11px; font-weight: 700; line-height: 1.25; margin-bottom: 6px; height: 2.4em; overflow: hidden; }
    .s8 .pills { display: flex; flex-wrap: wrap; gap: 4px; }
    .s8 .pills span, .s8 .pills button {
      font-size: 9px; font-weight: 800; padding: 3px 7px; border-radius: 99px; border: 1px solid #E8EAED; background: #F8F9FA; color: #5F6368;
    }
    .s8 .pills .e { background: #7B61FF; color: #fff; border-color: #7B61FF; }

    /* 9 two cells */
    .s9 .ibox { height: 88px; }
    .s9 .cap {
      position: absolute; left: 0; right: 0; bottom: 0; z-index: 2;
      background: linear-gradient(transparent, rgba(0,0,0,.72)); color: #fff;
      font-size: 11px; font-weight: 700; padding: 16px 8px 6px; line-height: 1.2;
    }
    .s9 .cells { display: grid; grid-template-columns: 1fr 1fr; }
    .s9 .cells div, .s9 .cells button { padding: 8px 4px; text-align: center; }
    .s9 .cells span { display: block; font-size: 8px; font-weight: 700; color: #5F6368; }
    .s9 .cells b { font-size: 12px; }
    .s9 .cells .earn { border-radius: 0; font-size: 12px; }

    /* 10 stub */
    .s10 { display: grid; grid-template-columns: 1fr 72px; }
    .s10 .main { padding: 0; min-width: 0; }
    .s10 .ibox { height: 84px; }
    .s10 .meta { padding: 6px 8px 8px; }
    .s10 .name { font-size: 11px; font-weight: 700; line-height: 1.25; }
    .s10 .sub { font-size: 10px; color: #5F6368; margin-top: 3px; display: flex; align-items: center; gap: 4px; }
    .s10 .stub {
      background: #7B61FF; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 2px; border-left: 1px dashed rgba(255,255,255,.45);
    }
    .s10 .stub u { font-size: 8px; text-decoration: none; font-weight: 700; opacity: .85; }
    .s10 .stub b { font-size: 13px; }
  </style>
</head>
<body>
  <div class="page">
    <h1>10 complete Home screens</h1>
    <p class="lead">Every phone is a full Home: greeting, wallet, search, chips, proof strip, <b>8 deals</b>, Help, nav. Scroll inside each handset. Photos are only the phone + TV files you gave.</p>
    <p class="note">Reply with <b>1–10</b>. Locked live demo is unchanged until you pick.</p>
    <nav class="jump" id="jump"></nav>
    <div class="board" id="board"></div>
  </div>
  <script>
    const INR = n => n.toLocaleString('en-IN');
    const DEALS = [
      { name: 'Motorola G57 Power 5G', gst: true, dark: false, img: '../images/motorola-g57.jpg', store: '../logos/fitted/stores/flipkart.png', card: null, cardName: 'Any card', spend: 17519, earn: 300 },
      { name: 'Samsung Galaxy M35 5G', gst: false, dark: true, img: '../images/samsung-m35.png', store: '../logos/fitted/stores/amazon.png', card: '../logos/fitted/cards/hdfc.png', cardName: 'HDFC', spend: 22999, earn: 450 },
      { name: 'Samsung HD TV 32"', gst: true, dark: false, img: '../images/samsung-tv-32.jpg', store: '../logos/fitted/stores/flipkart.png', card: '../logos/fitted/cards/axis.png', cardName: 'Axis', spend: 12499, earn: 380 },
      { name: 'iQOO Neo 10', gst: true, dark: false, img: '../images/motorola-g57.jpg', store: '../logos/fitted/stores/iqoo.png', card: '../logos/fitted/cards/onecard.png', cardName: 'OneCard', spend: 27999, earn: 500 },
      { name: 'Motorola Edge 60', gst: true, dark: false, img: '../images/motorola-g57.jpg', store: '../logos/fitted/stores/motorola.png', card: '../logos/fitted/cards/hsbc.png', cardName: 'HSBC', spend: 24999, earn: 380 },
      { name: 'vivo T4x', gst: true, dark: true, img: '../images/samsung-m35.png', store: '../logos/fitted/stores/vivo.png', card: '../logos/fitted/cards/pnb.png', cardName: 'PNB', spend: 19149, earn: 280 },
      { name: 'OPPO K13 5G', gst: true, dark: true, img: '../images/samsung-m35.png', store: '../logos/fitted/stores/oppo.png', card: '../logos/fitted/cards/rbl.png', cardName: 'RBL', spend: 16899, earn: 250 },
      { name: 'Samsung HD TV 32"', gst: true, dark: false, img: '../images/samsung-tv-32.jpg', store: '../logos/fitted/stores/flipkart.png', card: '../logos/fitted/cards/sbi.png', cardName: 'SBI', spend: 13299, earn: 420 }
    ];
    const pin = d => `<span class="pin"><img src="${d.store}" alt=""></span>`;
    const gst = d => d.gst ? '<span class="gst">GST</span>' : '';
    const bank = d => d.card ? `<img class="logo" src="${d.card}" alt=""> ${d.cardName}` : d.cardName;
    const ibox = d => `<div class="ibox${d.dark ? ' dark' : ''}"><img class="prod" src="${d.img}" alt="">${pin(d)}${gst(d)}</div>`;

    const chrome = (inner) => `
      <div class="status"><span>9:41</span><span>●●●</span></div>
      <div class="header"><div class="header-row">
        <div class="greeting"><h2>Hi, Vikram</h2><p>Earn with your card</p></div>
        <div class="actions"><span class="wallet">₹12,400</span><span class="icon">🔔</span><span class="icon">💬</span></div>
      </div></div>
      <div class="scroll">
        <div class="toolbar"><div class="search">⌕ Search deals…</div><div class="vtoggle"><span>☰</span><span class="on">⊞</span></div></div>
        <div class="chips"><span class="chip on">All Deals</span><span class="chip">Direct</span><span class="chip">Link</span></div>
        <div class="proof">🔥 <b>₹8.2L+</b> earned this week · 42 orders today</div>
        <div class="list-meta"><span>8 deals live</span><em>Highest earn ↓</em></div>
        <div class="pad">${inner}<span class="help">Help</span></div>
      </div>
      <div class="nav"><span class="on">Home</span><span>Orders</span><span>Wallet</span><span>Profile</span></div>`;

    const fn = {
      1: d => `<article class="card s1"><div class="ibox${d.dark ? ' dark' : ''}"><img class="prod" src="${d.img}" alt="">${pin(d)}${gst(d)}<span class="sticker">Earn ₹${d.earn}</span></div><div class="body"><div class="name">${d.name}</div><div class="sub">${bank(d)} · ₹${INR(d.spend)}</div></div></article>`,
      2: d => `<article class="card s2"><div class="ttl">${d.name}</div>${ibox(d)}<div class="foot"><span class="pay">${bank(d)} · ₹${INR(d.spend)}</span><button type="button" class="earn">Earn ₹${d.earn}</button></div></article>`,
      3: d => `<article class="s3"><div class="ibox${d.dark ? ' dark' : ''}"><img src="${d.img}" alt=""></div>${pin(d)}${gst(d)}<div class="wash"><div class="name">${d.name}</div><div class="bar"><span class="pay">Pay ₹${INR(d.spend)}</span><button type="button" class="earn">Earn ₹${d.earn}</button></div></div></article>`,
      4: d => `<article class="card s4">${ibox(d)}<div class="name">${d.name}</div><div class="sub">${bank(d)} · ₹${INR(d.spend)}</div><button type="button" class="earn">Earn ₹${d.earn}</button></article>`,
      5: d => `<article class="card s5">${ibox(d)}<div class="body"><div class="name">${d.name}</div><div class="row"><span class="pay">₹${INR(d.spend)}</span><button type="button" class="earn">+₹${d.earn}</button></div></div></article>`,
      6: d => `<article class="card s6">${ibox(d)}<div class="band"><div class="pay"><span>Pay</span>₹${INR(d.spend)}</div><button type="button" class="earn">Earn ₹${d.earn}</button></div><div class="name">${d.name} · ${d.cardName}</div></article>`,
      7: d => `<article class="card s7">${ibox(d)}<div class="body"><div class="name">${d.name}</div><div class="sub">${bank(d)}${d.gst ? ' · GST' : ''}</div><div class="money"><span class="pay">₹${INR(d.spend)}</span><button type="button" class="earn">Earn ₹${d.earn}</button></div></div></article>`,
      8: d => `<article class="card s8">${ibox(d)}<div class="body"><div class="name">${d.name}</div><div class="pills">${d.gst ? '<span>GST</span>' : ''}<span>${d.cardName}</span><span>₹${INR(d.spend)}</span><button type="button" class="e">Earn ₹${d.earn}</button></div></div></article>`,
      9: d => `<article class="card s9"><div class="ibox${d.dark ? ' dark' : ''}"><img class="prod" src="${d.img}" alt="">${pin(d)}${gst(d)}<div class="cap">${d.name}</div></div><div class="cells"><div><span>Pay</span><b>₹${INR(d.spend)}</b></div><button type="button" class="earn">Earn ₹${d.earn}</button></div></article>`,
      10: d => `<article class="card s10"><div class="main">${ibox(d)}<div class="meta"><div class="name">${d.name}</div><div class="sub">${bank(d)} · ₹${INR(d.spend)}</div></div></div><div class="stub"><u>Earn</u><b>₹${d.earn}</b></div></article>`
    };

    const hero = d => `<article class="hero"><img src="${d.img}" alt="">${pin(d)}${gst(d)}<div class="wash"><div class="kicker">Highest earn</div><div class="name">${d.name}</div><div class="bar"><span>Pay ₹${INR(d.spend)} · ${d.cardName}</span><button type="button" class="earn">Earn ₹${d.earn}</button></div></div></article>`;

    const STYLES = [
      { n: 1, title: 'Earn sticker', blurb: 'Earn on the photo like a price tag. Pay + bank under the name.', wrap: 'grid2' },
      { n: 2, title: 'Poster', blurb: 'Name above the photo. Footer: bank, pay, Earn pill.', wrap: 'grid2' },
      { n: 3, title: 'Overlay', blurb: 'The photo is the card. Name, pay, Earn sit on it.', wrap: 'grid2' },
      { n: 4, title: 'Caption pay', blurb: 'Pay is a grey line. Button is only Earn.', wrap: 'grid2' },
      { n: 5, title: 'Hero + grid', blurb: 'One featured deal on top, then a tight 2-column grid.', wrap: 'grid2' },
      { n: 6, title: 'Photo band', blurb: 'Pay and Earn glued under the photo. Name is one line below.', wrap: 'grid2' },
      { n: 7, title: 'Wide row', blurb: 'Full-width Home rows. Photo left, facts + Earn on the right.', wrap: 'stack' },
      { n: 8, title: 'Pills', blurb: 'GST, bank, pay, Earn as chips under the photo. No extra boxes.', wrap: 'grid2' },
      { n: 9, title: 'Two cells', blurb: 'Name on the photo. Pay | Earn as two equal cells under it.', wrap: 'grid2' },
      { n: 10, title: 'Ticket stub', blurb: 'Purple Earn stub on the right, like a torn ticket.', wrap: 'stack' }
    ];

    document.getElementById('jump').innerHTML = STYLES.map(s => `<a href="#s${s.n}">${s.n}. ${s.title}</a>`).join('');
    document.getElementById('board').innerHTML = STYLES.map(s => {
      let inner;
      if (s.n === 5) inner = hero(DEALS[3]) + `<div class="grid2">${DEALS.filter((_, i) => i !== 3).map(fn[5]).join('')}</div>`;
      else inner = `<div class="${s.wrap}">${DEALS.map(fn[s.n]).join('')}</div>`;
      return `<section class="panel" id="s${s.n}">
        <div class="ph"><h2><span class="num">${s.n}</span> ${s.title}</h2><p>${s.blurb} Scroll the phone.</p></div>
        <div class="pb"><div class="phone">${chrome(inner)}</div></div>
      </section>`;
    }).join('');
  </script>
</body>
</html>
