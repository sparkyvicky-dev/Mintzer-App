<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Mintzer drawer icon — festive preview</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #1a1a1a;
      font-family: "Google Sans", "Segoe UI", sans-serif;
      color: #fff;
    }
    .wrap { display: flex; gap: 48px; align-items: flex-end; }
    .col { text-align: center; }
    .label {
      font-size: 13px;
      letter-spacing: .04em;
      color: #c4c7c5;
      margin-bottom: 14px;
    }
    .phone {
      width: 280px;
      height: 520px;
      border-radius: 36px;
      background: #0e0e10;
      border: 3px solid #2a2a2e;
      padding: 28px 18px 18px;
      box-shadow: 0 24px 60px rgba(0,0,0,.45);
    }
    .drawer-title {
      font-size: 22px;
      font-weight: 500;
      margin: 8px 8px 22px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px 8px;
    }
    .app { text-align: center; }
    .ghost {
      width: 52px;
      height: 52px;
      margin: 0 auto 6px;
      border-radius: 16px;
      background: #2c2c31;
    }
    .name { font-size: 11px; color: #e8eaed; }
    .muted { color: #9aa0a6; }
    .icon {
      width: 52px;
      height: 52px;
      margin: 0 auto 6px;
      border-radius: 16px;
      background: #7B61FF;
      position: relative;
      overflow: hidden;
    }
    .icon svg { width: 100%; height: 100%; display: block; }
    .diya {
      position: absolute;
      right: 3px;
      top: 2px;
      width: 16px;
      height: 16px;
    }
    .note {
      margin-top: 16px;
      font-size: 12px;
      color: #9aa0a6;
      max-width: 280px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="col">
      <div class="label">NOW</div>
      <div class="phone">
        <div class="drawer-title">All apps</div>
        <div class="grid">
          <div class="app"><div class="ghost"></div><div class="name muted">Phone</div></div>
          <div class="app"><div class="ghost"></div><div class="name muted">Chrome</div></div>
          <div class="app">
            <div class="icon" aria-label="Mintzer">
              <svg viewBox="0 0 52 52">
                <circle cx="18.2" cy="16.5" r="3.1" fill="#fff"/>
                <circle cx="33.8" cy="16.5" r="3.1" fill="#fff"/>
                <path fill="#fff" d="M12.5 22.2h10.2l3.3 5.6 3.3-5.6h10.2v16.2h-6.4V29.2l-3.8 6.2h-2.6l-3.8-6.2v9.2h-6.4V22.2z"/>
              </svg>
            </div>
            <div class="name">Mintzer</div>
          </div>
          <div class="app"><div class="ghost"></div><div class="name muted">Maps</div></div>
        </div>
      </div>
      <div class="note">Plain purple icon in the drawer.</div>
    </div>
    <div class="col">
      <div class="label">SALE SEASON</div>
      <div class="phone">
        <div class="drawer-title">All apps</div>
        <div class="grid">
          <div class="app"><div class="ghost"></div><div class="name muted">Phone</div></div>
          <div class="app"><div class="ghost"></div><div class="name muted">Chrome</div></div>
          <div class="app">
            <div class="icon" aria-label="Mintzer festive">
              <svg viewBox="0 0 52 52">
                <circle cx="18.2" cy="17.2" r="3.1" fill="#fff"/>
                <circle cx="33.8" cy="17.2" r="3.1" fill="#fff"/>
                <path fill="#fff" d="M12.5 23h10.2l3.3 5.6 3.3-5.6h10.2V39h-6.4V29.8l-3.8 6.2h-2.6l-3.8-6.2V39h-6.4V23z"/>
              </svg>
              <svg class="diya" viewBox="0 0 16 16">
                <path fill="#F6C445" d="M8 1.2c.4 1.3.2 2.2-.4 3.1.9-.2 1.8-.1 2.6.5-1.3.1-2.1.7-2.2 1.8C7.2 5.2 6.6 4.2 8 1.2z"/>
                <path fill="#E8A317" d="M3.2 9.2c0-1.2 1.6-2 4.8-2s4.8.8 4.8 2c0 2.2-2 3.6-4.8 3.6S3.2 11.4 3.2 9.2z"/>
                <path fill="#F6C445" d="M4.2 12.6h7.6c.2.7-.6 1.4-3.8 1.4s-4-.7-3.8-1.4z"/>
              </svg>
            </div>
            <div class="name">Mintzer</div>
          </div>
          <div class="app"><div class="ghost"></div><div class="name muted">Maps</div></div>
        </div>
      </div>
      <div class="note">Same icon, with a small lamp in the corner. Name stays Mintzer.</div>
    </div>
  </div>
</body>
</html>
