<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Mintzer icon — decoration around the M</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #141416; color: #fff; font-family: "Segoe UI", sans-serif; padding: 28px 32px 48px; }
    h1 { font-size: 20px; margin: 0 0 6px; }
    p { margin: 0 0 22px; color: #bdc1c6; font-size: 14px; }
    table { border-collapse: separate; border-spacing: 18px 22px; }
    th { font-size: 13px; letter-spacing: .08em; color: #c4c7c5; font-weight: 650; }
    .card { text-align: center; }
    .icon, .tiny { margin: 0 auto 6px; background: #7B61FF center / cover no-repeat; }
    .icon { width: 120px; height: 120px; border-radius: 30px; }
    .tiny { width: 44px; height: 44px; border-radius: 12px; }
    .cap { font-size: 13px; }
  </style>
</head>
<body>
  <h1>Same M. Decoration sits in the purple around it.</h1>
  <p>SALE and FEST are the words you picked. The small icon is the drawer size. The mark itself is not redrawn.</p>
  <table>
    <tr><th></th><th>SALE</th><th>FEST</th></tr>
    <tr>
      <td class="cap">1 · Ring</td>
      <td class="card"><div class="icon" style="background-image:url('festive-icon-around-m/sale-ring.png')"></div><div class="tiny" style="background-image:url('festive-icon-around-m/sale-ring.png')"></div></td>
      <td class="card"><div class="icon" style="background-image:url('festive-icon-around-m/fest-ring.png')"></div><div class="tiny" style="background-image:url('festive-icon-around-m/fest-ring.png')"></div></td>
    </tr>
    <tr>
      <td class="cap">2 · Stars</td>
      <td class="card"><div class="icon" style="background-image:url('festive-icon-around-m/sale-stars.png')"></div><div class="tiny" style="background-image:url('festive-icon-around-m/sale-stars.png')"></div></td>
      <td class="card"><div class="icon" style="background-image:url('festive-icon-around-m/fest-stars.png')"></div><div class="tiny" style="background-image:url('festive-icon-around-m/fest-stars.png')"></div></td>
    </tr>
    <tr>
      <td class="cap">3 · Lamps</td>
      <td class="card"><div class="icon" style="background-image:url('festive-icon-around-m/sale-lamps.png')"></div><div class="tiny" style="background-image:url('festive-icon-around-m/sale-lamps.png')"></div></td>
      <td class="card"><div class="icon" style="background-image:url('festive-icon-around-m/fest-lamps.png')"></div><div class="tiny" style="background-image:url('festive-icon-around-m/fest-lamps.png')"></div></td>
    </tr>
    <tr>
      <td class="cap">4 · Crown</td>
      <td class="card"><div class="icon" style="background-image:url('festive-icon-around-m/sale-crown.png')"></div><div class="tiny" style="background-image:url('festive-icon-around-m/sale-crown.png')"></div></td>
      <td class="card"><div class="icon" style="background-image:url('festive-icon-around-m/fest-crown.png')"></div><div class="tiny" style="background-image:url('festive-icon-around-m/fest-crown.png')"></div></td>
    </tr>
    <tr>
      <td class="cap">5 · Corners</td>
      <td class="card"><div class="icon" style="background-image:url('festive-icon-around-m/sale-brackets.png')"></div><div class="tiny" style="background-image:url('festive-icon-around-m/sale-brackets.png')"></div></td>
      <td class="card"><div class="icon" style="background-image:url('festive-icon-around-m/fest-brackets.png')"></div><div class="tiny" style="background-image:url('festive-icon-around-m/fest-brackets.png')"></div></td>
    </tr>
  </table>
</body>
</html>
