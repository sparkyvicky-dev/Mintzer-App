<svg width="411" height="400" viewBox="0 0 411 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="48" y1="0" x2="380" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B794F0"/>
      <stop offset="1" stop-color="#7B61FF"/>
    </linearGradient>
    <linearGradient id="coin" x1="280" y1="48" x2="360" y2="140" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.55"/>
    </linearGradient>
  </defs>
  <rect width="410.667" height="400" rx="16" fill="url(#g)"/>
  <!-- soft orbs -->
  <circle cx="340" cy="70" r="78" fill="#FFFFFF" fill-opacity="0.08"/>
  <circle cx="60" cy="320" r="96" fill="#FFFFFF" fill-opacity="0.06"/>
  <!-- earn badge -->
  <rect x="28" y="28" width="132" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.18"/>
  <text x="94" y="54" text-anchor="middle" fill="#FFFFFF" font-family="Outfit, Arial, sans-serif" font-size="15" font-weight="600">Earn more</text>
  <!-- big rupee mark -->
  <text x="48" y="168" fill="#FFFFFF" fill-opacity="0.95" font-family="Bricolage Grotesque, Arial, sans-serif" font-size="96" font-weight="700">₹</text>
  <!-- upward spark line -->
  <path d="M180 170c28-8 42-36 68-42 26-6 40 8 66 2" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M300 124l18-6 2 18" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- coin stack suggestion -->
  <ellipse cx="318" cy="118" rx="34" ry="12" fill="url(#coin)"/>
  <ellipse cx="318" cy="108" rx="34" ry="12" fill="#FFFFFF" fill-opacity="0.35"/>
  <ellipse cx="318" cy="98" rx="34" ry="12" fill="#FFFFFF" fill-opacity="0.55"/>
</svg>
